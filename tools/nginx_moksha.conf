# moksha.com.br: só arquivos estáticos, quem roda o jogo é o navegador.
# Instalado em /etc/nginx/sites-available/moksha.com.br. O HTTPS é o certbot que acrescenta.
server {
    listen 80;
    server_name moksha.com.br www.moksha.com.br;
    root /var/www/moksha;
    index index.html;

    access_log /var/log/nginx/moksha.access.log;
    error_log  /var/log/nginx/moksha.error.log;

    # O build usa threads: sem estes dois o jogo nem abre.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # Os nomes dos arquivos não mudam entre versões: o navegador revalida a cada visita
    # (ETag) e só baixa de novo se mudou.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/octet-stream application/javascript text/javascript text/css;

    location / {
        try_files $uri $uri/ =404;
    }
}
