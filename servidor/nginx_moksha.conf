# moksha.com.br: landing e conta na raiz, jogo em /jogar/ (só com login), API em /api/.
# Instalado em /etc/nginx/sites-available/moksha.com.br.
#   /var/www/moksha/           site/ do repositório + conta.html
#   /var/www/moksha/jogar/     build web do Godot (tools/publicar_web.py)
#   127.0.0.1:3310             moksha-api (servidor/api)
server {
    server_name moksha.com.br www.moksha.com.br;
    root /var/www/moksha;
    index index.html;

    access_log /var/log/nginx/moksha.access.log;
    error_log  /var/log/nginx/moksha.error.log;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/octet-stream application/javascript text/javascript text/css application/json image/svg+xml;

    # Os nomes dos arquivos não mudam entre versões: o navegador revalida a cada visita
    # (ETag) e só baixa de novo se mudou.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # O jogo: o nginx pergunta à API se há sessão com personagem antes de entregar
    # qualquer arquivo. Sem login, vai para a tela de conta e volta para cá depois.
    location /jogar/ {
        auth_request /_gate;
        error_page 401 = @conta;
        # add_header aqui dentro substitui os de cima: repetir todos
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        # O build usa threads: sem estes dois o jogo nem abre.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri $uri/ =404;
    }
    location = /jogar { return 301 /jogar/; }
    location @conta { return 302 /conta.html?volta=/jogar/; }

    location = /_gate {
        internal;
        proxy_pass http://127.0.0.1:3310/api/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3310;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
        # O jogo também chama a API: precisa poder ser carregada com COEP
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/moksha.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/moksha.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.moksha.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = moksha.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name moksha.com.br www.moksha.com.br;
    return 404; # managed by Certbot
}
